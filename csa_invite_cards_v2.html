<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSA™ — Your Child's Progress Card</title>
<!-- v1.3.12 dynamic Airtable scratch card: robust copy PIN fallback + fixed ARC login link -->
<style>
body{margin:0;background:#060D1A;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:100%;max-width:480px;background:linear-gradient(145deg,#0B1829,#0F2035);border:1px solid rgba(0,200,180,.35);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45)}.head{text-align:center;padding:30px 26px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.eyebrow{color:#00C8B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.name{font-size:30px;font-weight:900;margin:14px 0 8px}.sub{color:#C8DCF0;font-size:14px;line-height:1.55}.body{padding:24px 26px}.bar{height:7px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#F5A623;width:0%;transition:width 1s}.scratch{position:relative;margin-top:20px;border-radius:14px;overflow:hidden;border:1px solid rgba(0,200,180,.3)}.pinbox{background:linear-gradient(135deg,rgba(0,200,180,.1),rgba(245,166,35,.1));padding:28px;text-align:center}.pin{font-size:32px;letter-spacing:.22em;font-weight:900;color:#00C8B4}.hint{font-size:12px;color:#7DA0C0;margin-top:8px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.actions{padding:0 26px 28px}.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:15px;font-weight:800;margin-top:12px}.primary{background:#00C8B4;color:#060D1A}.secondary{border:1px solid rgba(255,255,255,.18);color:#C8DCF0}.locked{opacity:.45;pointer-events:none}.error{max-width:520px;text-align:center;color:#C8DCF0}.voucher{display:none;margin-top:16px;background:rgba(255,215,0,.08);border:1px dashed rgba(255,215,0,.45);border-radius:14px;padding:16px;text-align:center}.voucher b{color:#FFD700;font-size:22px;letter-spacing:.12em}.copybtn{margin-top:12px;background:rgba(0,200,180,.1);border:1px solid rgba(0,200,180,.35);color:#00C8B4;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer}.copybtn.copied{background:rgba(0,200,180,.22);color:#fff}</style>
</head>
<body>
<div id="app" class="error">Loading CSA Progress Card...</div>
<script>
const PROXY_BASE = 'https://csa-airtable-proxy.ceoaciiadmin.workers.dev'; // absolute Cloudflare proxy URL, do not change to relative path
const ARC_LOGIN_URL = 'https://cognitivesystems.academy/csa-progression-arc#check-progress-2';
let student=null, revealed=false;
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function first(s){return String(s||'Student').trim().split(/\s+/)[0]||'Student'}
async function load(){
 const token=(new URLSearchParams(location.search).get('token')||'').trim().toUpperCase();
 if(!token){return fail('Invalid access link. Please contact CSA for your personal progress card link.');}
 const r=await fetch(`${PROXY_BASE}/scratch-card?token=${encodeURIComponent(token)}`);
 const d=await r.json().catch(()=>({}));
 if(!r.ok||!d.ok){return fail('This link is invalid or has expired. Please contact CSA.');}
 student=d; render();
}
function fail(msg){document.getElementById('app').className='error';document.getElementById('app').innerHTML=`<h1>Invalid Access Link</h1><p>${esc(msg)}</p>`;}
function render(){
 const name=student.name||'Student', fn=student.preferred_name||first(name), xp=Number(student.xp||0), level=Math.min(Math.max(1+Math.floor(Math.min(xp,1399)/200),1),7);
 document.getElementById('app').className='card';
 document.getElementById('app').innerHTML=`<div class="head"><div class="eyebrow">🚀 CSA STEM League — Special Camper Invite</div><div class="name">${esc(name)}</div><div class="sub">Your child completed a CSA workshop and built a real DSA portfolio.<br>Their progress is live — scratch below to unlock.</div></div><div class="body"><div style="font-size:11px;color:#7DA0C0;text-transform:uppercase;font-weight:700">🤖 Progression ARC</div><div class="bar"><div id="fill" class="fill"></div></div><div style="display:flex;justify-content:space-between;color:#7DA0C0;font-size:12px"><span>${xp} XP earned</span><span>L${level}</span></div><div class="scratch"><div class="pinbox"><div class="pin" id="pinText">${esc(student.pin||'------')}</div><div class="hint">Your child's access PIN</div><button id="copyPinBtn" class="copybtn" onclick="copyPin()">📋 Copy PIN</button></div><canvas id="scratch"></canvas></div><div class="hint" style="text-align:center;margin-top:8px">👆 Scratch to reveal · <a href="#" style="color:#00C8B4" onclick="reveal();return false">Tap to reveal instantly</a></div><div id="voucher" class="voucher">🎁 Voucher Code<br><b>${esc(student.voucher_code||student.disc||'')}</b><div class="hint">Save this code before closing.</div></div></div><div class="actions"><a id="arc" class="btn primary locked" target="_blank" href="https://cognitivesystems.academy/csa-progression-arc#check-progress-2">🔒 Scratch, Copy PIN, then View Progression ARC</a><a class="btn secondary" target="_blank" href="${esc(student.register||'https://www.cognitivesystems.academy/holiday-workshop-singapore')}">🎯 Explore Holiday Workshops →</a></div>`;
 setTimeout(()=>document.getElementById('fill').style.width=Math.min((xp/1400)*100,100)+'%',100); initScratch();
}
function initScratch(){const c=document.getElementById('scratch'), box=c.parentElement; c.width=box.clientWidth; c.height=box.clientHeight; const x=c.getContext('2d'), W=c.width,H=c.height; const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#1A3050');g.addColorStop(.5,'#2A4870');g.addColorStop(1,'#1A3050');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(0,200,180,.7)';x.font='bold 14px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('✦ SCRATCH TO REVEAL ✦',W/2,H/2);x.globalCompositeOperation='destination-out';let draw=false,count=0;function pos(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}function move(e){if(!draw)return;e.preventDefault();const p=pos(e);x.beginPath();x.arc(p.x,p.y,28,0,Math.PI*2);x.fill();if(++count>8)reveal()}c.onmousedown=e=>{draw=true;move(e)};c.onmousemove=move;c.onmouseup=()=>draw=false;c.onmouseleave=()=>draw=false;c.ontouchstart=e=>{draw=true;move(e)};c.ontouchmove=move;c.ontouchend=()=>draw=false;}

function copyPin(){
 const pin=String((student&&student.pin)||document.getElementById('pinText')?.textContent||'').replace(/\s+/g,'').trim().toUpperCase();
 if(!pin||pin==='------')return;
 const btn=document.getElementById('copyPinBtn');
 const old=btn?btn.textContent:'';
 function show(msg, ok=true){
   if(btn){
     btn.textContent=msg;
     btn.classList.toggle('copied', ok);
     setTimeout(()=>{btn.textContent=old||'📋 Copy PIN';btn.classList.remove('copied');},2600);
   }
 }
 function fallback(){
   let copied=false;
   const ta=document.createElement('textarea');
   ta.value=pin;
   ta.setAttribute('readonly','');
   ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;z-index:-1';
   document.body.appendChild(ta);
   ta.focus();
   ta.select();
   ta.setSelectionRange(0, pin.length);
   try{ copied=document.execCommand('copy'); }catch(e){ copied=false; }
   document.body.removeChild(ta);
   if(copied){ show('✓ PIN Copied'); }
   else {
     // Last resort for restrictive browsers/embedded viewers.
     window.prompt('Copy this PIN:', pin);
     show('PIN shown — copy manually', false);
   }
 }
 if(navigator.clipboard && window.isSecureContext){
   navigator.clipboard.writeText(pin).then(()=>show('✓ PIN Copied')).catch(fallback);
 } else {
   fallback();
 }
}

function reveal(){if(revealed)return;revealed=true;const c=document.getElementById('scratch');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);const a=document.getElementById('arc');a.classList.remove('locked');a.textContent='✨ View Progression ARC Login';document.getElementById('voucher').style.display='block';}
load().catch(()=>fail('Unable to load this card. Please try again later.'));
</script>
</body>
</html>
